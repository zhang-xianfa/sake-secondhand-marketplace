{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center pt-2">
    <div class="card shadow-sm p-5" style="width: 500px; border-radius: 20px;">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">登录账户</h3>
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label>⽤户名</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">登录</button>
             <!-- 新增的注册链接 -->
          <div class="text-center mt-3">
            <small class="text-muted">
              没有账号？<a href="{{ url_for('auth.register') }}" class="text-decoration-none">立即注册</a>
            </small>
          </div>
        </form>
        </div>
    </div>
  </div>
</div>
{% endblock %}
