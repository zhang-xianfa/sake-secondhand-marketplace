<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山科校园二手物品交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6f6f6; }
        .navbar { background-color: #ffe60f; }
        .navbar a, .navbar-brand { color: black !important; }
        .card { box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); border: none; }
        .btn-primary { background-color: #ffe60f; border: none; }
        .btn-primary:hover { background-color: rgba(255, 230, 15, 0.9); }
        .product-img {width: 240px;height: 240px;object-fit: cover;}
        .search-btn {background-color: #ffe60f;border-radius: 20px;border-color: black;border-width: 2px;font-size: 13px;border-left: none;}
        .search-input {border-radius: 20px 20px 20px 20px;border-color: black;border-width: 2px;border-right: none;font-size: 13px;}
        .price-tag {font-family: Arial, sans-serif;display: inline-flex;align-items: baseline; /* 关键：基线对齐 */}
        .currency {font-size: 15px;margin-right: 0.1em;font-weight: bold;color: #ff4f24;}
        .price {font-size: 28px;font-weight: bold;color: #ff4f24;}
        .category-item { padding: 0.05rem 1rem; } /* 移除 border-bottom */
        .category-icon { width: 20px; height: 20px; margin-right: 0.5rem;}
        .category-link { color: #333; text-decoration: none; margin: 0.2rem; }
        .category-link:hover { color: #ff4400; text-decoration: underline; }
        .unread-badge {display: inline-block;width: 18px;height: 18px;border-radius: 50%;background-color: #f63537;color: white;font-size: 12px;text-align: center;line-height: 18px;position: relative;left: 200px;top: 25px;margin-left: 0px;}
        .nav-item-relative {position: relative;}
        .col-60 { width: 60%; }
        .col-20 { width: 20%; }
    </style>
</head>
<body>

<nav class="navbar justify-content-center navbar-expand-lg p-0">
    <div style="width: 1300px;">
        <nav class="navbar">
            <div class="container-fluid">
                <a class="text-white mx-5" href="/" style="font-family: 'STHupo', '华文琥珀', sans-serif; font-size: 50px; text-decoration: none;" >sa科</a>
                <form class="d-flex flex-grow-1" method="get" action="{{ url_for('index.index') }}">
                    <div class="container-fluid px-0 mx-5">
                        <div class="input-group search-container">
                            <input type="text" class="form-control search-input flex-grow-1" name="q" placeholder="搜索商品">
                            <button class="search-btn d-flex align-items-center p-2" type="submit">
                                <img src="{{ url_for('static', filename='png/sousuo.png') }}" height="16">搜索
                            </button>
                        </div>
                    </div>
                </form>
                <div class="d-flex align-items-center">
                    {% if current_user.is_authenticated %}
                        <a class="btn btn-sm me-1 d-flex align-items-center" href="/user" style="background-color: #ffe60f; color: #000;">
                            <img src="{{ current_user.avatar or url_for('static', filename='default-avatar.png') }}"class="rounded-circle" width="30" height="30" alt="avatar">用户中心
                        </a>
                    {% else %}
                        <a class="btn btn-sm me-1 d-flex align-items-center" href="{{ url_for('auth.login') }}" style="background-color: #ffe60f; color: #000;">
                            <img src="{{ url_for('static', filename='png/denglu.png')}}" width="20", class="me-1" ><img>登录
                        </a>
                    {% endif %}
                    <a class="btn btn-sm me-1 d-flex align-items-center" href="{{ url_for('goods.publish') }}" style="background-color: #ffe60f; color: #000;">
                        <img src="{{ url_for('static', filename='png/maixianzhi.png')}}" width="20", class="me-1" ><img>发闲置
                    </a>
                </div>
            </div>
        </nav>

    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-info">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

     {% block content %}{% endblock %}
</div>

{#增加js，⽀持Bootstrap的交互功能，⽐如Tab切换、模态框、下拉菜单等#}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{# 引入 Socket.IO 客户端库 #}
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>
    // 初始化 Toast 容器，用于显示实时通知
    document.addEventListener('DOMContentLoaded', function() {
        const toastContainer = document.createElement('div');
        toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
        toastContainer.style.zIndex = '1080'; // 确保在顶部
        document.body.appendChild(toastContainer);

        // 初始化 WebSocket 连接
        {% if current_user.is_authenticated %}
            var socket = io();

            socket.on('connect', function() {
                console.log('Connected to WebSocket server!');
            });

            socket.on('disconnect', function() {
                console.log('Disconnected from WebSocket server!');
            });

            // 监听新的通知事件
            socket.on('new_notification', function(data) {
                console.log('New notification received:', data);

                // 更新全局未读红点
                let badge = document.getElementById('global-unread-badge');
                let currentCount = parseInt(badge ? badge.innerText : 0);
                if (!badge) {
                    // 如果没有红点，创建一个
                    badge = document.createElement('span');
                    badge.id = 'global-unread-badge';
                    badge.className = 'unread-badge';
                    document.querySelector('.nav-item-relative').appendChild(badge);
                }
                badge.innerText = currentCount + 1;
                badge.style.display = 'block'; // 确保显示

                // 显示 Bootstrap Toast 通知
                const toastHtml = `
                    <div class="toast align-items-center text-white bg-info border-0" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="d-flex">
                            <div class="toast-body">
                                <strong>新消息:</strong> ${data.message}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                `;
                const toastElement = new DOMParser().parseFromString(toastHtml, 'text/html').body.firstChild;
                toastContainer.appendChild(toastElement);

                const bsToast = new bootstrap.Toast(toastElement);
                bsToast.show();

                // 点击通知跳转到相关页面
                toastElement.querySelector('.toast-body').addEventListener('click', function() {
                    if (data.url) {
                        window.location.href = data.url;
                        bsToast.hide();
                    }
                });
            });
        {% endif %}
    });
</script>
</body>
</html>
